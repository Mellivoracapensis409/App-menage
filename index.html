<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chez nous">
<meta name="theme-color" content="#2a4bd7">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chez nous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1430);--card:light-dark(#f4f5fb,#181f45);--ink:light-dark(#121633,#eef0ff);--mute:light-dark(#5b6084,#a9aed6);--line:light-dark(#e2e4f0,#2a3263);--a:#2a4bd7;--a-soft:light-dark(#e4e9ff,#22307a);--b:#e9502f;--b-soft:light-dark(#ffe6df,#5a2418);--sun:#f4b740;--head:light-dark(#2a4bd7,#1a2466)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{background:var(--head);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(5vw,16px) 22px}
.hin{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo svg{width:34px;height:34px}
.who{margin-left:auto;background:rgba(255,255,255,.16);border:0;border-radius:99px;padding:8px 14px;min-height:40px;color:#fff;font-weight:500}
main{max-width:680px;margin:0 auto;padding:0 max(5vw,16px)}
h1{font-size:clamp(30px,7vw,44px);line-height:1.05;margin:26px 0 4px;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 18px;font-size:16px}
h2{font-size:19px;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:14px;font-weight:500;color:var(--mute)}
h3{font-size:14px;font-weight:500;color:var(--mute);margin:14px 0 6px}
ul{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 4px 12px 0;border-bottom:1px solid var(--line)}
.chk{flex:none;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--a);background:transparent;position:relative;transition:background .2s}
.chk:hover{background:var(--a-soft)}
.mine-b .chk{border-color:var(--b)}.mine-b .chk:hover{background:var(--b-soft)}
.chk.on{background:var(--a)}.chk.on::after{content:"";position:absolute;left:14px;top:9px;width:10px;height:18px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.tx{flex:1;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.tx b{font-weight:600;font-size:17px;line-height:1.3}
.def{color:var(--mute);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.meta i,.meta em{font-style:normal;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--card);white-space:nowrap}
.late .meta em{background:var(--sun);color:#1b1400}
.meta .warn{background:var(--b-soft);color:var(--ink)}
.own{flex:none;border:0;border-radius:99px;padding:6px 12px;min-height:36px;font-size:14px;font-weight:600;white-space:nowrap;align-self:center}
.o-a{background:var(--a);color:#fff}.o-b{background:var(--b);color:#fff}.o-x{background:transparent;border:2px dashed var(--line);color:var(--mute)}
.more{flex:none;width:40px;height:40px;border:0;background:transparent;border-radius:10px;font-size:20px;color:var(--mute);align-self:center}
.more:hover{background:var(--card)}
.card{background:var(--card);border-radius:18px;padding:16px 18px;margin:12px 0}
.card p{margin:0 0 10px}
.ask{border-left:6px solid var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;background:var(--a);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.warm{background:var(--b)}
.empty{padding:22px 18px;border:2px dashed var(--line);border-radius:18px;color:var(--mute);text-align:center}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
details{margin-top:18px;border-top:1px solid var(--line)}
summary{cursor:pointer;padding:16px 0;font-weight:600;font-size:17px;min-height:44px}
details .chk{border-color:var(--line)}
.zone{margin-bottom:8px}
.zone h2{justify-content:space-between}
.add{border:0;background:transparent;color:var(--a);font-weight:600;padding:12px 0;min-height:44px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:6px 0 2px}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 6px}
.stat div{background:var(--card);border-radius:16px;padding:14px}
.stat b{display:block;font-size:clamp(26px,7vw,36px);line-height:1}
.stat span{font-size:13px;color:var(--mute)}
.log li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.log small{margin-left:auto;color:var(--mute);white-space:nowrap}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.split .card{margin:0}
.split h3{margin-top:0;font-weight:600;font-size:16px;color:var(--ink)}
.split li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0}
.split li span:last-child{color:var(--mute);white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;color:var(--mute);text-decoration:none;font-size:13px;font-weight:500;min-height:52px}
nav a svg{width:22px;height:22px}
nav a[aria-current=page]{color:var(--a);background:var(--a-soft)}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,40,.5)}
.dl{padding:22px}
.dl h2{margin:0 0 14px;font-size:22px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
input,select{width:100%;font-size:16px;padding:11px 12px;min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.acts .sp{margin-left:auto}
.menu button{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:12px;padding:14px 16px;margin:6px 0;min-height:48px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:9;width:max-content;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:var(--sun);color:#1b1400;border-radius:10px;padding:8px 12px;font-weight:600;min-height:40px}
.note{font-size:14px;color:var(--mute);margin:16px 0}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.pick button{min-height:64px;font-size:18px}
@media(max-width:520px){.split,.two{grid-template-columns:minmax(0,1fr)}.own{padding:6px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="hin">
<div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 19 20 6l15 13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="17" width="20" height="17" rx="3" fill="#fff"/><rect x="17" y="24" width="6" height="10" rx="1.5" fill="#f4b740"/><circle cx="20" cy="13" r="0" fill="#fff"/></svg>Chez nous</div>
<button class="who" id="who" type="button">Qui es-tu ?</button>
</div></header>
<main id="app"><h1>Chez nous</h1><p class="sub">Chargement de la maison…</p></main>
<nav><div>
<a href="#aujourdhui" data-v="aujourdhui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</a>
<a href="#maison" data-v="maison"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>La maison</a>
<a href="#semaine" data-v="semaine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>La semaine</a>
</div></nav>

<dialog id="dlg"><div class="dl" id="dlgIn"></div></dialog>
<div class="toast" id="toast" role="status"><span id="toastTx"></span><button type="button" id="toastUndo">Annuler</button></div>

<script type="module">
const FIREBASE={apiKey:"COLLER_ICI",authDomain:"COLLER_ICI",projectId:"COLLER_ICI",storageBucket:"COLLER_ICI",messagingSenderId:"COLLER_ICI",appId:"COLLER_ICI"};
const FOYER="CHOISIR_UN_CODE_LONG_ET_SECRET";
const SEED=[["t01","cuisine","Vider le lave-vaisselle","Toute la vaisselle propre rangée, paniers vides",1,"le matin","r",0],["t02","cuisine","Lancer le lave-vaisselle","Rempli, pastille ajoutée, lancé",1,"après le dîner","r",0],["t03","cuisine","Nettoyer le plan de travail et l’évier","Plan dégagé et essuyé, évier vide",1,"après le dîner","r",0],["t04","cuisine","Prévoir le dîner","Choisir, vérifier les ingrédients et préparer",1,"avant 18 h","r",0],["t05","cuisine","Faire la liste de courses","Placards et frigo vérifiés, liste complétée",7,"le vendredi","r",4],["t06","cuisine","Faire les courses","Acheter, ranger, jeter les emballages",7,"le samedi","r",5],["t07","cuisine","Trier le frigo","Périmés jetés, clayettes essuyées",7,"avant les courses","r",4],["t08","cuisine","Nettoyer le micro-ondes et le four","Intérieur et porte propres",30,"","r",10],["t09","linge","S’occuper du linge","Laver, sécher, plier et ranger",3,"quand le panier est plein","r",1],["t10","linge","Changer les draps","Lit défait, draps lavés, lit refait",14,"le dimanche","r",6],["t11","linge","Changer les serviettes et les torchons","Serviettes et torchons propres en place",7,"","r",3],["t12","linge","Acheter de la lessive avant d’en manquer","Stock vérifié, racheté s’il reste moins d’un mois",30,"quand il reste un bidon","p",8],["t13","sols","Passer l’aspirateur","Toutes les pièces, sous la table compris",7,"","r",2],["t14","sols","Laver les sols","Cuisine, salle de bains et entrée",14,"après l’aspirateur","r",9],["t15","sols","Nettoyer la salle de bains","Lavabo, douche et miroir",7,"","r",3],["t16","sols","Nettoyer les toilettes","Cuvette, abattant et sol autour",7,"","r",2],["t17","sols","Racheter papier toilette et produits ménagers","Stock vérifié et complété",30,"quand il reste un paquet","p",12],["t18","animaux","Gérer les litières de Zack et Honey","Nettoyer, remettre du sable, évacuer les déchets",1,"le soir","r",0],["t19","animaux","Nourrir Zack et Honey","Gamelles remplies, eau fraîche",1,"matin et soir","r",0],["t20","animaux","Changer entièrement les litières","Bacs vidés, lavés, sable neuf",14,"","r",7],["t21","animaux","Racheter croquettes et sable","Commandé ou acheté avant la fin du dernier sac",21,"quand il reste un sac","p",10],["t22","animaux","Vermifuge et antiparasitaire","Traitement donné et date notée",90,"","p",30],["t23","animaux","Rendez-vous vétérinaire pour les vaccins","Rendez-vous pris et noté",365,"","p",60],["t24","poubelles","Sortir les poubelles","Ordures et tri descendus, sacs neufs remis",3,"la veille du ramassage","r",1],["t25","poubelles","Descendre le verre","Bac à verre vidé",14,"","r",6],["t26","poubelles","Racheter sacs poubelle, éponges et liquide vaisselle","Stock vérifié et complété",30,"","p",15],["t27","poubelles","Détartrer la bouilloire et la cafetière","Détartrées et rincées",30,"","r",18],["t28","papiers","Trier le courrier","Ouvert, jeté ou rangé",7,"le dimanche","r",6],["t29","papiers","Payer et classer les factures du logement","Loyer, électricité et internet vérifiés et classés",30,"en début de mois","r",8],["t30","papiers","Noter les rendez-vous liés au logement","Entretien, syndic, réparations ajoutés ici",30,"","p",14],["t31","papiers","Renouveler l’attestation d’assurance habitation","Attestation reçue et rangée",365,"","p",90]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ZONES=[['cuisine','Cuisine, vaisselle, nourriture et courses'],['linge','Linge, draps et serviettes'],['sols','Sols, salle de bains et toilettes'],['animaux','Les chats, leur nourriture et leurs stocks'],['poubelles','Poubelles, consommables et entretien'],['papiers','Courrier, factures et rendez-vous du logement']];
const FREQ=[[0,'Une seule fois'],[1,'Chaque jour'],[2,'Tous les 2 jours'],[3,'Tous les 3 jours'],[7,'Chaque semaine'],[14,'Toutes les 2 semaines'],[30,'Chaque mois'],[90,'Tous les 3 mois'],[180,'Tous les 6 mois'],[365,'Chaque année']];
let S={a:'Flo',b:''},T=[],me=null,db=null,loaded=false,stale=false,undoFn=null,toastT=null,seeded=false;
let FB=null,demo=false;
const tRef=id=>FB.doc(db,'foyers',FOYER,'tasks',id),hRef=()=>FB.doc(db,'foyers',FOYER);
const demoSave=()=>{try{localStorage.setItem('cn_demo',JSON.stringify({S,T}))}catch(e){}};
const demoPatch=(id,p)=>{T=T.map(t=>t.id===id?{...t,...p}:t);demoSave();render()};
const upd=async(id,p)=>demo?demoPatch(id,p):FB.updateDoc(tRef(id),p);
const addT=async d=>{if(demo){T=[...T,{...d,id:'n'+Date.now().toString(36)}];demoSave();render()}else await FB.addDoc(FB.collection(db,'foyers',FOYER,'tasks'),d)};
const delT=async id=>{if(demo){T=T.filter(t=>t.id!==id);demoSave();render()}else await FB.deleteDoc(tRef(id))};
const setH=async d=>{if(demo){S={...S,...d};demoSave();render()}else await FB.setDoc(hRef(),d,{merge:true})};
try{me=localStorage.getItem('cn_me')}catch(e){}

const iso=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);
const next=t=>t.done?null:(t.due||today());
const nm=k=>k==='a'?(S.a||'Personne 1'):k==='b'?(S.b||'Personne 2'):'À répartir';
const oth=k=>k==='a'?'b':'a';
const zl=k=>(ZONES.find(z=>z[0]===k)||['', 'Autre'])[1];
const freqTxt=f=>(FREQ.find(x=>x[0]==f)||[0,'Tous les '+f+' jours'])[1];
const dayName=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{weekday:'long'});
const short=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const when=s=>{const d=diff(s,today());return d<-1?'en retard de '+(-d)+' jours':d===-1?'depuis hier':d===0?"aujourd'hui":d===1?'demain':d<7?dayName(s):'le '+short(s)};
const byNext=(x,y)=>(next(x)||'9').localeCompare(next(y)||'9')||x.t.localeCompare(y.t);
const live=()=>T.filter(t=>!t.done);

function row(t,o={}){
  const n=next(t),late=n&&n<today();
  return `<li class="task ${late?'late':''} ${t.o==='b'?'mine-b':''}" data-id="${esc(t.id)}">
  ${o.check===false?'':`<button class="chk" type="button" data-act="done" aria-label="Marquer comme fait : ${esc(t.t)}"></button>`}
  <div class="tx"><b>${esc(t.t)}</b>${t.d?`<span class="def">${esc(t.d)}</span>`:''}
  <span class="meta">${o.rhythm?`<i>${esc(freqTxt(t.f))}</i>`:''}${t.w?`<i>${esc(t.w)}</i>`:''}${n?`<em>${esc(when(n))}</em>`:''}${t.s==='bloque'?`<i class="warn">Bloqué${t.sn?' : '+esc(t.sn):''}</i>`:''}${t.s==='echange'?`<i class="warn">Échange demandé</i>`:''}</span></div>
  ${o.own?`<button class="own o-${t.o||'x'}" type="button" data-act="owner" aria-label="Responsable : ${esc(nm(t.o))}. Toucher pour changer">${esc(nm(t.o))}</button>`:''}
  <button class="more" type="button" data-act="menu" aria-label="Plus d'actions pour ${esc(t.t)}">⋯</button></li>`;
}

function vToday(){
  const td=today(),L=live();
  if(!me)return `<h1>Bonjour</h1><p class="sub">Dis d'abord qui utilise ce téléphone.</p><button class="btn" data-act="who" type="button">Choisir</button>`;
  const o=oth(me);
  const mine=L.filter(t=>t.o===me&&next(t)<=td).sort(byNext);
  const theirs=L.filter(t=>t.o===o&&next(t)<=td).sort(byNext);
  const asks=L.filter(t=>t.o===o&&t.s==='echange');
  const soon=L.filter(t=>t.o===me&&next(t)>td&&diff(next(t),td)<=3).sort(byNext);
  const free=L.filter(t=>!t.o);
  const date=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  return `<h1>Aujourd'hui</h1><p class="sub">${esc(date.charAt(0).toUpperCase()+date.slice(1))} · ce que ${esc(nm(me))} prend en charge</p>
  ${asks.map(t=>`<div class="card ask" data-id="${esc(t.id)}"><p><b>${esc(nm(o))}</b> propose un échange : <b>${esc(t.t)}</b>${t.sn?' — '+esc(t.sn):''}</p><div class="row"><button class="btn" type="button" data-act="accept">Je la prends</button><button class="btn ghost" type="button" data-act="decline">Pas cette fois</button></div></div>`).join('')}
  <h2>Pour toi <span class="n">${mine.length||''}</span></h2>
  ${mine.length?`<ul>${mine.map(t=>row(t)).join('')}</ul>`:`<div class="empty"><b>Rien pour toi aujourd'hui.</b>${L.some(t=>t.o===me)?'Tes prochaines tâches apparaîtront ici le jour venu.':'Aucune tâche ne t’est encore attribuée.'}</div>`}
  ${free.length?`<div class="card"><p><b>${free.length} tâche${free.length>1?'s':''} à répartir ensemble.</b> Choisissez qui s'en occupe, et elles apparaîtront ici.</p><a class="btn" href="#maison" style="display:inline-flex;align-items:center;text-decoration:none">Voir la maison</a></div>`:''}
  ${soon.length?`<h2>Bientôt pour toi</h2><ul>${soon.map(t=>row(t,{check:true})).join('')}</ul>`:''}
  <details><summary>Côté ${esc(nm(o))} aujourd'hui (${theirs.length})</summary>${theirs.length?`<ul>${theirs.map(t=>row(t,{check:false})).join('')}</ul>`:'<p class="note">Rien de prévu.</p>'}</details>`;
}

function vHouse(){
  const L=live(),a=L.filter(t=>t.o==='a').length,b=L.filter(t=>t.o==='b').length,x=L.length-a-b,tot=L.length||1;
  return `<h1>La maison</h1><p class="sub">Tout ce qui se cache derrière « faire le ménage ». Touche un prénom pour changer le responsable.</p>
  <div class="bar" aria-hidden="true"><span style="width:${a/tot*100}%;background:var(--a)"></span><span style="width:${b/tot*100}%;background:var(--b)"></span></div>
  <div class="legend"><span><i style="background:var(--a)"></i>${esc(nm('a'))} · ${a}</span><span><i style="background:var(--b)"></i>${esc(nm('b'))} · ${b}</span><span><i style="background:var(--line)"></i>À répartir · ${x}</span></div>
  ${ZONES.map(([k,l])=>{const z=L.filter(t=>t.z===k),r=z.filter(t=>t.k!=='p').sort(byNext),p=z.filter(t=>t.k==='p').sort(byNext);
  return `<section class="zone"><h2>${esc(l)} <span class="n">${z.length}</span></h2>
  ${r.length?`<h3>Ce qui revient</h3><ul>${r.map(t=>row(t,{own:true,rhythm:true,check:false})).join('')}</ul>`:''}
  ${p.length?`<h3>À anticiper</h3><ul>${p.map(t=>row(t,{own:true,rhythm:true,check:false})).join('')}</ul>`:''}
  <button class="add" type="button" data-act="new" data-z="${k}">+ Ajouter une tâche</button></section>`}).join('')}`;
}

function vWeek(){
  const td=today(),from=addD(td,-6),L=live();
  const log=[];T.forEach(t=>(t.h||[]).forEach(e=>{if(e.at>=from)log.push({t:t.t,at:e.at,by:e.by})}));
  log.sort((x,y)=>y.at.localeCompare(x.at));
  const wait=L.filter(t=>t.o&&next(t)<td).sort(byNext);
  const up=L.filter(t=>next(t)>td&&diff(next(t),td)<=7&&(t.f>=7||t.k==='p')).sort(byNext);
  const blocked=L.filter(t=>t.s==='bloque');
  const carry=p=>ZONES.map(([k,l])=>[l,L.filter(t=>t.z===k&&t.o===p).length]).filter(x=>x[1]);
  const col=p=>`<div class="card"><h3>${esc(nm(p))}</h3>${carry(p).length?`<ul>${carry(p).map(([l,n])=>`<li><span>${esc(l)}</span><span>${n}</span></li>`).join('')}</ul>`:'<p class="note">Aucune responsabilité pour l’instant.</p>'}</div>`;
  return `<h1>La semaine</h1><p class="sub">Du ${esc(short(from))} au ${esc(short(td))}. Un état des lieux pour en parler, pas un classement.</p>
  <div class="stat"><div><b>${log.length}</b><span>choses faites</span></div><div><b>${wait.length}</b><span>en attente</span></div><div><b>${up.length}</b><span>à prévoir</span></div></div>
  <h2>Ce qui a été fait</h2>${log.length?`<ul class="log">${log.slice(0,40).map(e=>`<li><span class="dot" style="background:var(--${e.by==='b'?'b':'a'})"></span><span>${esc(e.t)}</span><small>${esc(dayName(e.at))}</small></li>`).join('')}</ul>`:'<p class="note">Rien de coché cette semaine pour l’instant.</p>'}
  ${blocked.length?`<h2>Bloqué</h2><ul>${blocked.map(t=>row(t,{own:true,check:false})).join('')}</ul>`:''}
  <h2>Ce qui attend</h2>${wait.length?`<ul>${wait.map(t=>row(t,{own:true,check:false})).join('')}</ul>`:'<p class="note">Rien en retard.</p>'}
  <h2>À prévoir dans les 7 jours</h2>${up.length?`<ul>${up.map(t=>row(t,{own:true,check:false})).join('')}</ul>`:'<p class="note">Rien de particulier.</p>'}
  <h2>Qui porte quoi</h2><div class="split">${col('a')}${col('b')}</div>
  <div class="acts"><button class="btn ghost" type="button" data-act="copy">Copier le récapitulatif</button></div>`;
}

function render(){
  const v=['aujourdhui','maison','semaine'].includes(location.hash.slice(1))?location.hash.slice(1):'aujourdhui';
  document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#who').textContent=me?'Ce téléphone : '+nm(me):'Qui es-tu ?';
  if(!db){$('#app').innerHTML=`<h1>Chez nous</h1><p class="sub">${loaded?'La connexion à la base de données n’est pas configurée ou a échoué.':'Chargement de la maison…'}</p>`;return}
  if(loaded&&!T.length){$('#app').innerHTML=`<h1>Chez nous</h1><div class="empty"><b>La maison est vide.</b>Ajoute une première tâche.</div><div class="acts"><button class="btn" type="button" data-act="new" data-z="cuisine">Ajouter une tâche</button></div>`;return}
  $('#app').innerHTML=(demo?'<p class="note">Mode démo : les données restent sur ce téléphone. Branche Firebase pour les partager.</p>':'')+(stale?'<p class="note">Connexion lente : les données affichées peuvent ne pas être à jour.</p>':'')+(v==='maison'?vHouse():v==='semaine'?vWeek():vToday());
}

const find=id=>T.find(t=>t.id===id);
async function save(id,patch){
  try{await upd(id,patch);return true}catch(e){toast('Enregistrement impossible.');return false}
}
function toast(msg,undo){
  $('#toastTx').textContent=msg;undoFn=undo||null;$('#toastUndo').style.display=undo?'':'none';
  $('#toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('show'),5000);
}
$('#toastUndo').addEventListener('click',()=>{const f=undoFn;undoFn=null;$('#toast').classList.remove('show');if(f)f()});

async function markDone(t,btn){
  if(btn)btn.classList.add('on');
  const td=today(),prev={h:t.h||[],due:t.due||td,done:!!t.done,s:t.s||'',sn:t.sn||''};
  const patch={h:[...(t.h||[]),{at:td,by:me||'a'}].slice(-20),s:'',sn:''};
  if(t.f>0)patch.due=addD(td,t.f);else patch.done=true;
  if(await save(t.id,patch))toast('« '+t.t+' » : fait.',()=>save(t.id,prev));
}

const dlg=$('#dlg'),dIn=$('#dlgIn');
const open=h=>{dIn.innerHTML=h;try{dlg.showModal()}catch(e){dlg.setAttribute('open','')}};
const close=()=>{try{dlg.close()}catch(e){dlg.removeAttribute('open')}};
dlg.addEventListener('click',e=>{if(e.target===dlg)close()});

function whoDialog(){
  open(`<h2>Qui utilise ce téléphone ?</h2><p class="note">Chacun choisit une fois sur son téléphone. Les prénoms sont partagés.</p>
  <div class="two"><div><label for="na">Premier prénom</label><input id="na" value="${esc(S.a)}" autocomplete="off"></div><div><label for="nb">Second prénom</label><input id="nb" value="${esc(S.b)}" placeholder="Son prénom" autocomplete="off"></div></div>
  <div class="pick"><button class="btn" type="button" data-pick="a">C'est moi : <span id="pa">${esc(nm('a'))}</span></button><button class="btn warm" type="button" data-pick="b">C'est moi : <span id="pb">${esc(nm('b'))}</span></button></div>`);
  $('#na').addEventListener('input',e=>$('#pa').textContent=e.target.value||'Personne 1');
  $('#nb').addEventListener('input',e=>$('#pb').textContent=e.target.value||'Personne 2');
}

function menuDialog(t){
  const mine=t.o&&t.o===me,b=[];
  if(t.s==='bloque')b.push(['unblock','Ce n’est plus bloqué']);else if(t.o)b.push(['block','Signaler que c’est bloqué']);
  if(mine)b.push(t.s==='echange'?['unswap','Annuler la demande d’échange']:['swap','Demander un échange à '+nm(oth(me))]);
  b.push(['later','Reporter à demain'],['edit','Modifier la tâche']);
  open(`<h2>${esc(t.t)}</h2><p class="note">${esc(nm(t.o))} · ${esc(freqTxt(t.f))}${t.w?' · '+esc(t.w):''}</p>
  <div id="noteBox" hidden><label for="sn">Ce qui bloque (facultatif)</label><input id="sn" placeholder="Ex. plus de sable, attendre la livraison"></div>
  <div class="menu">${b.map(([a,l])=>`<button type="button" data-m="${a}" data-id="${esc(t.id)}">${esc(l)}</button>`).join('')}</div>
  <div class="acts"><button class="btn ghost sp" type="button" data-m="close">Fermer</button></div>`);
}

function editDialog(t,z){
  const n=!t;t=t||{t:'',d:'',z:z||'cuisine',o:'',f:7,w:'',k:'r',due:today()};
  open(`<h2>${n?'Nouvelle tâche':'Modifier'}</h2><form id="ef">
  <label for="ft">Action précise</label><input id="ft" required value="${esc(t.t)}" placeholder="Ex. vider le lave-vaisselle">
  <label for="fd">Ce que « terminé » veut dire</label><input id="fd" value="${esc(t.d)}" placeholder="Ex. vaisselle rangée, panier vide">
  <div class="two"><div><label for="fz">Rubrique</label><select id="fz">${ZONES.map(([k,l])=>`<option value="${k}" ${k===t.z?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
  <div><label for="fo">Responsable</label><select id="fo">${[['','À répartir'],['a',nm('a')],['b',nm('b')]].map(([k,l])=>`<option value="${k}" ${k===(t.o||'')?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
  <div><label for="ff">Fréquence</label><select id="ff">${FREQ.map(([k,l])=>`<option value="${k}" ${k==t.f?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
  <div><label for="fk">Type</label><select id="fk"><option value="r" ${t.k!=='p'?'selected':''}>Ce qui revient</option><option value="p" ${t.k==='p'?'selected':''}>À anticiper</option></select></div>
  <div><label for="fw">Déclencheur</label><input id="fw" value="${esc(t.w)}" placeholder="Ex. après le dîner"></div>
  <div><label for="fn">Prochaine fois</label><input id="fn" type="date" value="${esc(t.due||today())}"></div></div>
  <div class="acts">${n?'':'<button class="btn ghost" type="button" id="del">Supprimer</button>'}<button class="btn ghost sp" type="button" data-m="close">Annuler</button><button class="btn" type="submit">Enregistrer</button></div></form>`);
  $('#ef').addEventListener('submit',async e=>{
    e.preventDefault();
    const d={t:$('#ft').value.trim(),d:$('#fd').value.trim(),z:$('#fz').value,o:$('#fo').value,f:+$('#ff').value,k:$('#fk').value,w:$('#fw').value.trim(),due:$('#fn').value||today()};
    if(!d.t)return;
    try{close();if(n)await addT({...d,h:[],s:'',sn:'',done:false});else await upd(t.id,{...d,done:false})}catch(err){toast('Enregistrement impossible.')}
  });
  const del=$('#del');
  if(del)del.addEventListener('click',async()=>{if(del.dataset.sure){try{close();await delT(t.id)}catch(err){toast('Suppression impossible.')}}else{del.dataset.sure='1';del.textContent='Confirmer la suppression';del.classList.add('warm')}});
}

dIn.addEventListener('click',async e=>{
  const p=e.target.closest('[data-pick]');
  if(p){
    const a=$('#na').value.trim(),b=$('#nb').value.trim();
    me=p.dataset.pick;try{localStorage.setItem('cn_me',me)}catch(err){}
    if(db&&(a!==S.a||b!==S.b)){setH({a,b}).catch(()=>{})}
    S={a,b};close();render();return;
  }
  const m=e.target.closest('[data-m]');if(!m)return;
  const t=find(m.dataset.id),a=m.dataset.m;
  if(a==='close')return close();
  if(a==='block'){const box=$('#noteBox');if(box.hidden){box.hidden=false;m.textContent='Confirmer : c’est bloqué';$('#sn').focus();return}await save(t.id,{s:'bloque',sn:$('#sn').value.trim()});toast('Signalé comme bloqué. La tâche reste à '+nm(t.o)+'.')}
  if(a==='unblock')await save(t.id,{s:'',sn:''});
  if(a==='swap'){const box=$('#noteBox');if(box.hidden){box.hidden=false;$('#noteBox label').textContent='Un mot pour expliquer (facultatif)';m.textContent='Envoyer la demande';$('#sn').focus();return}await save(t.id,{s:'echange',sn:$('#sn').value.trim()});toast('Demande envoyée. La tâche reste la tienne tant qu’elle n’est pas acceptée.')}
  if(a==='unswap')await save(t.id,{s:'',sn:''});
  if(a==='later')await save(t.id,{due:addD(today(),1)});
  if(a==='edit')return editDialog(t);
  close();
});

$('#app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const li=b.closest('[data-id]'),t=li&&find(li.dataset.id),a=b.dataset.act;
  if(a==='who')return whoDialog();
  if(a==='new')return editDialog(null,b.dataset.z);
  if(a==='copy'){
    const td=today(),from=addD(td,-6),L=live(),lines=['Chez nous — semaine du '+short(from)+' au '+short(td),''];
    lines.push('Fait :');T.forEach(x=>(x.h||[]).filter(h=>h.at>=from).forEach(h=>lines.push('- '+x.t+' ('+nm(h.by)+', '+dayName(h.at)+')')));
    lines.push('','En attente :');L.filter(x=>x.o&&next(x)<td).forEach(x=>lines.push('- '+x.t+' ('+nm(x.o)+')'));
    lines.push('','À prévoir :');L.filter(x=>next(x)>td&&diff(next(x),td)<=7&&(x.f>=7||x.k==='p')).forEach(x=>lines.push('- '+x.t+' ('+nm(x.o)+', '+when(next(x))+')'));
    try{await navigator.clipboard.writeText(lines.join('\n'));toast('Récapitulatif copié.')}catch(err){toast('Copie refusée par le navigateur.')}
    return;
  }
  if(!t)return;
  if(a==='done')return markDone(t,b);
  if(a==='menu')return menuDialog(t);
  if(a==='owner'){const nx=t.o===''||!t.o?'a':t.o==='a'?'b':'';b.className='own o-'+(nx||'x');b.textContent=nm(nx);await save(t.id,{o:nx,s:'',sn:''});return}
  if(a==='accept'){await save(t.id,{o:me,s:'',sn:''});toast('C’est noté, elle est à toi.');return}
  if(a==='decline'){await save(t.id,{s:'',sn:''});return}
});
$('#who').addEventListener('click',whoDialog);
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();

const seedDocs=()=>{const td=today();return SEED.map(([id,z,t,d,f,w,k,o])=>({id,t,d,z,o:'',f,w,k,due:addD(td,o),h:[],s:'',sn:'',done:false}))};
async function seed(){
  if(seeded)return;seeded=true;
  const b=FB.writeBatch(db);
  seedDocs().forEach(({id,...x})=>b.set(tRef(id),x));
  b.set(hRef(),{a:S.a,b:S.b},{merge:true});
  try{await b.commit()}catch(e){seeded=false}
}
function startDemo(){
  demo=true;db={demo:true};
  let saved=null;try{saved=JSON.parse(localStorage.getItem('cn_demo')||'null')}catch(e){}
  if(saved&&Array.isArray(saved.T)&&saved.T.length){T=saved.T;S=saved.S||S}else{T=seedDocs();demoSave()}
  loaded=true;render();
  if(!me)whoDialog();
}
(async()=>{
  if(Object.values(FIREBASE).some(v=>v==='COLLER_ICI')||FOYER.startsWith('CHOISIR'))return startDemo();
  try{
    const[A,F]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")]);
    FB=F;const app=A.initializeApp(FIREBASE);
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){db=F.initializeFirestore(app,{})}
  }catch(e){db=null}
  if(!db){loaded=true;render();return}
  const timer=setTimeout(()=>{stale=true;loaded=true;render()},10000);
  FB.onSnapshot(hRef(),s=>{if(s.exists()){const d=s.data();S={a:String(d.a||''),b:String(d.b||'')}}render()},()=>{});
  FB.onSnapshot(FB.collection(db,'foyers',FOYER,'tasks'),{includeMetadataChanges:true},s=>{
    T=s.docs.map(d=>{const x=d.data()||{};return{id:d.id,t:String(x.t||''),d:String(x.d||''),z:String(x.z||''),o:['a','b'].includes(x.o)?x.o:'',f:+x.f||0,w:String(x.w||''),k:x.k==='p'?'p':'r',due:typeof x.due==='string'?x.due:'',done:!!x.done,s:String(x.s||''),sn:String(x.sn||''),h:Array.isArray(x.h)?x.h.filter(e=>e&&typeof e.at==='string'):[]}});
    if(!s.metadata.fromCache){clearTimeout(timer);stale=false;if(s.empty)seed()}
    loaded=true;render();
    if(!me&&!$('#dlg').open)whoDialog();
  },()=>{clearTimeout(timer);stale=true;loaded=true;render()});
})();
</script>
</body>
